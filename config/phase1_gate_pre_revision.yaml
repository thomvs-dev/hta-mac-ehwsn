# Gate-resolved Phase 1 structural configuration.
# A ceiling of N=100 guarantees the inherited static allocation remains
# feasible for any frozen K=5 cluster realization. This is not the final T.
phase: 1
frame_slot_budget: 100
n_max: 3
queue_max_packets: 10
max_rounds: 3000
idle_energy:
  enabled: true
  p_idle_source: e_elec_j_per_bit
  slot_bit_times_source: packet_bits
cluster_selection:
  mode: frozen_heart_ch_once_at_reset
